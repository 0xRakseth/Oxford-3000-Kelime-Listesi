<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --paper:#faf6ee;
    --paper-shade:#efe8d8;
    --bg:#141a24;
    --line: rgba(28,36,48,0.14);

    --a1:#4c9a73; --a1-soft:#e4f1e9;
    --a2:#3c82a6; --a2-soft:#e2eef4;
    --b1:#c77d34; --b1-soft:#f7ead9;
    --b2:#a6423a; --b2-soft:#f4dfdc;

    --accent: var(--a1);
    --accent-soft: var(--a1-soft);

    --c-bildim:#2f7d54;
    --c-karistirdim:#c9702f;
    --c-tekrar:#5b4fa3;
    --c-sonraki:#3b4454;
  }

  * { box-sizing: border-box; }

  .fc-app{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(255,255,255,0.04), transparent 45%);
    color: var(--paper);
    font-family: 'Public Sans', sans-serif;
    padding: 24px 18px 28px;
    border-radius: 18px;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .fc-app.fc-loading .fc-controls,
  .fc-app.fc-loading .fc-topbar,
  .fc-app.fc-loading .fc-card{
    pointer-events: none;
    opacity: 0.5;
  }

  .fc-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .fc-header h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 21px;
    margin: 0;
  }
  .fc-header-right{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .fc-count{
    font-size: 13px;
    color: rgba(250,246,238,0.55);
    font-variant-numeric: tabular-nums;
  }
  .fc-icon-btn{
    height: 32px;
    padding: 0 12px 0 10px;
    border-radius: 8px;
    border: 1px solid rgba(250,246,238,0.2);
    background: rgba(250,246,238,0.08);
    color: rgba(250,246,238,0.9);
    display: flex; align-items: center; gap: 6px;
    font-family: 'Public Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .fc-icon-btn svg{ width: 15px; height: 15px; flex-shrink: 0; }
  .fc-icon-btn:active{ transform: scale(0.96); }

  /* search */
  .fc-search{
    position: relative;
    display: flex;
    align-items: center;
  }
  .fc-search svg{
    position: absolute; left: 12px;
    width: 15px; height: 15px;
    color: rgba(250,246,238,0.4);
    pointer-events: none;
  }
  .fc-search input{
    width: 100%;
    background: rgba(250,246,238,0.06);
    border: 1px solid rgba(250,246,238,0.16);
    border-radius: 10px;
    color: var(--paper);
    font-family: 'Public Sans', sans-serif;
    font-size: 13.5px;
    padding: 9px 34px 9px 34px;
    outline: none;
  }
  .fc-search input::placeholder{ color: rgba(250,246,238,0.35); }
  .fc-search input:focus{ border-color: rgba(250,246,238,0.4); }
  .fc-search-clear{
    position: absolute; right: 8px;
    width: 20px; height: 20px;
    border: none; background: rgba(250,246,238,0.14);
    border-radius: 999px;
    color: var(--paper);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
  }
  .fc-search-clear.fc-visible{ display: flex; }

  /* progress */
  .fc-progress-head{
    display: flex; align-items: center; justify-content: space-between;
  }
  .fc-reset-link{
    background: none; border: none;
    color: rgba(250,246,238,0.4);
    font-size: 11.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .fc-reset-link:hover{ color: rgba(250,246,238,0.7); }
  .fc-progress-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 14px;
    margin-top: 8px;
  }
  .fc-progress-row{ display: flex; flex-direction: column; gap: 4px; }
  .fc-progress-row-top{
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px;
  }
  .fc-progress-row-top .fc-plevel{ font-weight: 700; color: rgba(250,246,238,0.75); }
  .fc-progress-row-top .fc-pct{ color: rgba(250,246,238,0.45); font-variant-numeric: tabular-nums; }
  .fc-progress-track{
    height: 6px;
    border-radius: 999px;
    background: rgba(250,246,238,0.1);
    overflow: hidden;
  }
  .fc-progress-fill{
    height: 100%;
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .fc-tabrow{ display: flex; gap: 6px; flex-wrap: wrap; }
  .fc-tabrow-label{ font-size: 11px; color: rgba(250,246,238,0.4); font-weight: 600; margin-bottom: -4px; }
  .fc-tab{
    border: 1px solid rgba(250,246,238,0.16);
    background: transparent;
    color: rgba(250,246,238,0.75);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: 'Public Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .fc-tab .fc-tab-n{ font-size: 11px; opacity: 0.7; }
  .fc-tab[data-active="true"]{ color: var(--ink); border-color: transparent; }
  .fc-tab[data-level="A1"][data-active="true"]{ background: var(--a1); color:#0e2418;}
  .fc-tab[data-level="A2"][data-active="true"]{ background: var(--a2); color:#071c26;}
  .fc-tab[data-level="B1"][data-active="true"]{ background: var(--b1); color:#2c1502;}
  .fc-tab[data-level="B2"][data-active="true"]{ background: var(--b2); color:#2a0c09;}
  .fc-tab[data-level="all"][data-active="true"]{ background: #d8d2c2; }
  .fc-tab[data-status="bildim"][data-active="true"]{ background: var(--c-bildim); color:#eafff2;}
  .fc-tab[data-status="karistirdim"][data-active="true"]{ background: var(--c-karistirdim); color:#fff3e6;}
  .fc-tab[data-status="tekrar"][data-active="true"]{ background: var(--c-tekrar); color:#f1eeff;}
  .fc-tab[data-status="all"][data-active="true"]{ background: #d8d2c2; }

  .fc-topbar{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .fc-topbtn{
    border: none; border-radius: 9px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff; opacity: 0.9;
  }
  .fc-topbtn svg{ width: 16px; height: 16px; }
  .fc-topbtn:active{ transform: scale(0.94); }

  .fc-stage{ perspective: 1600px; width: 100%; }

  .fc-card{ position: relative; width: 100%; aspect-ratio: 4 / 3; cursor: pointer; outline: none; }
  .fc-card-inner{
    position: relative; width: 100%; height: 100%;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
  }
  .fc-card-inner.fc-no-anim{ transition: none !important; }
  .fc-card[data-flipped="true"] .fc-card-inner{ transform: rotateY(180deg); }

  .fc-face{
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 18px 40px -18px rgba(0,0,0,0.55), 0 3px 0 var(--paper-shade);
    padding: 24px 26px;
    display: flex; flex-direction: column;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .fc-face-front{ align-items: center; justify-content: center; text-align: center; gap: 8px; }
  .fc-face-back{ transform: rotateY(180deg); justify-content: center; gap: 12px; }

  .fc-level-tag{
    position: absolute; top: 14px; left: 14px;
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
  }
  .fc-status-tag{
    position: absolute; top: 14px; right: 14px;
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  }

  .fc-word{ font-family: 'Fraunces', serif; font-size: clamp(28px, 6vw, 40px); font-weight: 500; line-height: 1.1; }
  .fc-okunus{ font-family: 'Public Sans', sans-serif; color: var(--ink-soft); font-size: 15px; }
  .fc-okunus::before{ content: "okunuşu: "; opacity: 0.6; }
  .fc-tap-hint{ margin-top: 4px; font-size: 12px; color: rgba(28,36,48,0.4); }

  .fc-tr-main{ font-size: 23px; font-weight: 700; color: var(--ink); }
  .fc-tr-secondary{ font-size: 14px; color: var(--ink-soft); margin-top: -6px; }
  .fc-tr-secondary b{ color: var(--ink); font-weight: 600; }
  .fc-divider{ height: 1px; background: var(--line); }
  .fc-example{ font-size: 15px; line-height: 1.5; color: var(--ink); }
  .fc-example-label{ font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }

  .fc-controls{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .fc-btn{
    border: none; border-radius: 11px; padding: 12px 6px;
    font-family: 'Public Sans', sans-serif; font-size: 12.5px; font-weight: 600;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform 0.12s ease; color: #fff;
  }
  .fc-btn:active{ transform: scale(0.96); }
  .fc-btn svg{ width: 18px; height: 18px; }
  .fc-btn[disabled]{ opacity: 0.35; cursor: not-allowed; }

  .fc-btn-bildim, .fc-topbtn-bildim{ background: var(--c-bildim); }
  .fc-btn-karistirdim, .fc-topbtn-karistirdim{ background: var(--c-karistirdim); }
  .fc-btn-tekrar, .fc-topbtn-tekrar{ background: var(--c-tekrar); }
  .fc-btn-sonraki, .fc-topbtn-sonraki{ background: var(--c-sonraki); }

  .fc-empty{ text-align: center; padding: 36px 20px; color: rgba(250,246,238,0.6); font-size: 14px; }

  @media (prefers-reduced-motion: reduce){ .fc-card-inner{ transition: none; } }
</style>

</div>

  const WORDS = RAW_WORDS.map((w, i) => ({ ...w, id: "w" + i }));

  const LEVELS = [
    { key: "all", label: "Tümü" },
    { key: "A1", label: "A1" },
    { key: "A2", label: "A2" },
    { key: "B1", label: "B1" },
    { key: "B2", label: "B2" },
  ];
  const STATUSES = [
    { key: "all", label: "Hepsi" },
    { key: "bildim", label: "Bildiklerim" },
    { key: "karistirdim", label: "Karıştırdıklarım" },
    { key: "tekrar", label: "Tekrara Attıklarım" },
  ];
  const STATUS_TAG_STYLE = {
    bildim: "background: var(--c-bildim); color:#eafff2;",
    karistirdim: "background: var(--c-karistirdim); color:#fff3e6;",
    tekrar: "background: var(--c-tekrar); color:#f1eeff;",
  };
  const STATUS_LABEL_SHORT = { bildim: "Bildim", karistirdim: "Karıştırdım", tekrar: "Tekrar" };
  const LEVEL_COLOR = { A1: "var(--a1)", A2: "var(--a2)", B1: "var(--b1)", B2: "var(--b2)" };

  let state = {
    level: "all",
    statusFilter: "all",
    search: "",
    status: {},      // id -> 'bildim' | 'karistirdim' | 'tekrar'
    deckIds: [],
    index: 0,
    flipped: false,
  };

  function wordById(id){ return WORDS.find(w => w.id === id); }

  function matchesSearch(w){
    if (!state.search) return true;
    const q = state.search;
    return w.en.toLocaleLowerCase("tr").includes(q) || w.tr.toLocaleLowerCase("tr").includes(q);
  }

  function computeDeckIds(){
    return WORDS
      .filter(w => state.level === "all" || w.level === state.level)
      .filter(w => state.statusFilter === "all" || state.status[w.id] === state.statusFilter)
      .filter(matchesSearch)
      .map(w => w.id);
  }

  function counts(){
    const inLevel = WORDS.filter(w => state.level === "all" || w.level === state.level);
    const c = { all: inLevel.length, bildim: 0, karistirdim: 0, tekrar: 0 };
    inLevel.forEach(w => {
      const s = state.status[w.id];
      if (s) c[s]++;
    });
    return c;
  }

  function progressData(){
    return LEVELS.filter(l => l.key !== "all").map(l => {
      const items = WORDS.filter(w => w.level === l.key);
      const learned = items.filter(w => state.status[w.id] === "bildim").length;
      const pct = items.length ? Math.round((learned / items.length) * 100) : 0;
      return { key: l.key, total: items.length, learned, pct };
    });
  }

  function applyAccent(level){
    const app = document.getElementById("fcApp");
    const map = { A1:["--a1","--a1-soft"], A2:["--a2","--a2-soft"], B1:["--b1","--b1-soft"], B2:["--b2","--b2-soft"] };
    if (level && map[level]){
      app.style.setProperty("--accent", `var(${map[level][0]})`);
      app.style.setProperty("--accent-soft", `var(${map[level][1]})`);
    } else {
      app.style.setProperty("--accent", "var(--a1)");
      app.style.setProperty("--accent-soft", "var(--a1-soft)");
    }
  }

  // ---- flip-flash fix: programmatic card changes never animate rotateY.
  function resetCardInstant(){
    const inner = document.getElementById("fcCardInner");
    inner.classList.add("fc-no-anim");
    state.flipped = false;
    renderCard();
    void inner.offsetWidth;
    requestAnimationFrame(() => inner.classList.remove("fc-no-anim"));
  }

  // ---- persistence ----
  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        state.status = JSON.parse(raw);
      }
    } catch(e){
      state.status = {};
    }
  }

  function saveProgress(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.status));
    } catch(e){
      console.error("İlerleme kaydedilemedi:", e);
    }
  }

  function resetProgress(){
    if (!confirm("Tüm Bildim / Karıştırdım / Tekrar işaretlerini silmek istediğine emin misin?")) return;
    state.status = {};
    try{ localStorage.removeItem(STORAGE_KEY); } catch(e){ /* ignore */ }
    state.deckIds = computeDeckIds();
    state.index = 0;
    render();
    resetCardInstant();
  }

  function setLevel(level){
    state.level = level;
    state.deckIds = computeDeckIds();
    state.index = 0;
    render();
    resetCardInstant();
  }

  function setStatusFilter(statusKey){
    state.statusFilter = statusKey;
    state.deckIds = computeDeckIds();
    state.index = 0;
    render();
    resetCardInstant();
  }

  function setSearch(value){
    state.search = value.trim().toLocaleLowerCase("tr");
    document.getElementById("fcSearchClear").classList.toggle("fc-visible", value.length > 0);
    state.deckIds = computeDeckIds();
    state.index = 0;
    render();
    resetCardInstant();
  }

  function shuffleDeck(){
    const arr = state.deckIds.slice();
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    state.deckIds = arr;
    state.index = 0;
    render();
    resetCardInstant();
  }

  function currentWord(){
    if (state.deckIds.length === 0) return null;
    return wordById(state.deckIds[state.index % state.deckIds.length]);
  }

  function advanceNeutral(){
    if (state.deckIds.length === 0) return;
    state.index = (state.index + 1) % state.deckIds.length;
    render();
    resetCardInstant();
  }

  function markAndAdvance(newStatus){
    const w = currentWord();
    if (!w) return;
    state.status[w.id] = newStatus;
    saveProgress();

    if (state.statusFilter !== "all" && newStatus !== state.statusFilter){
      // word no longer belongs in this filtered pile — drop it from the
      // CURRENT (possibly shuffled) order instead of rebuilding from
      // scratch, so the shuffle is never lost.
      state.deckIds = state.deckIds.filter(id => id !== w.id);
      if (state.deckIds.length === 0 || state.index >= state.deckIds.length){
        state.index = 0;
      }
    } else {
      // composition doesn't change — just move forward, keep whatever
      // order (shuffled or not) the deck is already in.
      if (state.deckIds.length > 0){
        state.index = (state.index + 1) % state.deckIds.length;
      }
    }
    render();
    resetCardInstant();
  }

  function renderLevelTabs(){
    const el = document.getElementById("fcLevelTabs");
    el.innerHTML = "";
    LEVELS.forEach(l => {
      const btn = document.createElement("button");
      btn.className = "fc-tab";
      btn.dataset.level = l.key;
      btn.dataset.active = (state.level === l.key).toString();
      btn.textContent = l.label;
      btn.addEventListener("click", () => setLevel(l.key));
      el.appendChild(btn);
    });
  }

  function renderStatusTabs(){
    const el = document.getElementById("fcStatusTabs");
    el.innerHTML = "";
    const c = counts();
    STATUSES.forEach(s => {
      const btn = document.createElement("button");
      btn.className = "fc-tab";
      btn.dataset.status = s.key;
      btn.dataset.active = (state.statusFilter === s.key).toString();
      btn.innerHTML = `${s.label} <span class="fc-tab-n">${c[s.key]}</span>`;
      btn.addEventListener("click", () => setStatusFilter(s.key));
      el.appendChild(btn);
    });
  }

  function renderProgress(){
    const el = document.getElementById("fcProgressGrid");
    el.innerHTML = "";
    progressData().forEach(p => {
      const row = document.createElement("div");
      row.className = "fc-progress-row";
      row.innerHTML = `
        <div class="fc-progress-row-top">
          <span class="fc-plevel">${p.key}</span>
          <span class="fc-pct">${p.learned}/${p.total} · %${p.pct}</span>
        </div>
        <div class="fc-progress-track">
          <div class="fc-progress-fill" style="width:${p.pct}%; background:${LEVEL_COLOR[p.key]};"></div>
        </div>
      `;
      el.appendChild(row);
    });
  }

  function renderCard(){
    const card = document.getElementById("fcCard");
    const front = document.getElementById("fcFront");
    const back = document.getElementById("fcBack");
    const w = currentWord();

    card.dataset.flipped = state.flipped ? "true" : "false";

    if (!w){
      front.innerHTML = `<div class="fc-empty">Bu destede kart yok. Farklı bir seviye, durum ya da arama terimi seç.</div>`;
      back.innerHTML = "";
      document.getElementById("fcCount").textContent = "";
      return;
    }

    const st = state.status[w.id];
    const statusTag = st ? `<span class="fc-status-tag" style="${STATUS_TAG_STYLE[st]}">${STATUS_LABEL_SHORT[st]}</span>` : "";

    front.innerHTML = `
      <span class="fc-level-tag">${w.level}</span>
      ${statusTag}
      <div class="fc-word">${w.en}</div>
      <div class="fc-okunus">${w.okunus}</div>
      <div class="fc-tap-hint">Anlamı görmek için karta dokun</div>
    `;

    back.innerHTML = `
      <span class="fc-level-tag">${w.level}</span>
      ${statusTag}
      <div class="fc-tr-main">${w.tr}</div>
      ${w.secondary ? `<div class="fc-tr-secondary"><b>Yan anlam:</b> ${w.secondary}</div>` : ""}
      <div class="fc-divider"></div>
      <div>
        <div class="fc-example-label">Örnek cümle</div>
        <div class="fc-example">${w.example}</div>
      </div>
    `;

    document.getElementById("fcCount").textContent = `${state.index + 1} / ${state.deckIds.length}`;
    applyAccent(w.level);
  }

  function render(){
    renderLevelTabs();
    renderStatusTabs();
    renderProgress();
    renderCard();
  }

  // ---- events ----

  document.getElementById("fcCard").addEventListener("click", () => {
    if (!currentWord()) return;
    state.flipped = !state.flipped;
    document.getElementById("fcCard").dataset.flipped = state.flipped ? "true" : "false";
  });
  document.getElementById("fcCard").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " "){
      e.preventDefault();
      if (!currentWord()) return;
      state.flipped = !state.flipped;
      document.getElementById("fcCard").dataset.flipped = state.flipped ? "true" : "false";
    }
  });

  document.getElementById("fcShuffle").addEventListener("click", shuffleDeck);
  document.getElementById("fcResetProgress").addEventListener("click", resetProgress);

  document.getElementById("fcSearchInput").addEventListener("input", (e) => setSearch(e.target.value));
  document.getElementById("fcSearchClear").addEventListener("click", () => {
    const input = document.getElementById("fcSearchInput");
    input.value = "";
    setSearch("");
    input.focus();
  });

  function handleAction(action){
    if (action === "sonraki") advanceNeutral();
    else markAndAdvance(action);
  }

  document.getElementById("fcTopbar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (btn) handleAction(btn.dataset.action);
  });
  document.getElementById("fcBottomBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (btn) handleAction(btn.dataset.action);
  });

  // init
  (function init(){
    loadProgress();
    state.deckIds = computeDeckIds();
    render();
    document.getElementById("fcApp").classList.remove("fc-loading");
  })();
})();
</script>
